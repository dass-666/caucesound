name: CI
# Auditoría de la 0.10: cada commit de una rama con PR lanzaba la CI dos veces (push + pull_request), unas dos horas de
# máquina por commit. Ahora: una sola ejecución por PR (y en main al fusionar), se cancela la anterior de la misma
# rama si llega un commit nuevo, el token solo puede leer el repositorio y ningún trabajo puede quedarse colgado.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true } # Solo AI (third_party/solo-ai-studio, commit fijado)
      - name: Pruebas del motor (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/cs_core_tests
      - name: Pruebas del motor (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCS_SANITIZE=ON
          cmake --build build-asan
          ./build-asan/cs_core_tests
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true } # Solo AI (third_party/solo-ai-studio, commit fijado)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK y NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Motor nativo para pruebas de extremo a extremo en la JVM (JniBridge real + audio simulado)
        run: |
          cmake -S . -B build-hostjni -G Ninja -DCMAKE_BUILD_TYPE=Release -DCS_BUILD_HOST_JNI=ON -DCS_BUILD_TESTS=OFF
          cmake --build build-hostjni --target caucesound
          echo "CS_HOST_JNI_DIR=$PWD/build-hostjni" >> "$GITHUB_ENV"
      - name: Compilar y probar
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: caucesound-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
